name: Cloudron Catalog Publication

# Managed caller. Publication requires CLOUDRON_PUBLICATION_ENABLED=true;
# PRs validate and build without publishing. See docs/PUBLISHING.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudron-catalog-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  catalog:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: marcusquinn/aidevops/.github/workflows/cloudron-catalog-publish-reusable.yml@6606b999d0ed310aeb78efc802e216d6751bda9c
    with:
      aidevops_ref: 6606b999d0ed310aeb78efc802e216d6751bda9c
      package_checks: |
        shellcheck -x start.sh bin/warmblyctl bin/wait-for scripts/*.sh
        node --check web-extra/cloudron-sso.js
        commit="$(sed -n 's/^ARG WARMBLY_COMMIT=//p' Dockerfile)"
        src="${RUNNER_TEMP}/warmbly"
        git init -q "$src"
        git -C "$src" fetch -q --depth 1 https://github.com/warmbly/warmbly.git "$commit"
        git -C "$src" checkout -q FETCH_HEAD
        test "$(git -C "$src" rev-parse HEAD)" = "$commit"
        for p in patches/*.patch; do git -C "$src" apply --check "$PWD/$p"; git -C "$src" apply "$PWD/$p"; done
    secrets:
      CLOUDRON_RELEASE_PAT: ${{ secrets.CLOUDRON_RELEASE_PAT }}
