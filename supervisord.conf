;
; Warmbly's self-host stack in one container. Every program inherits the
; environment start.sh built; per-program differences are set here.
; bin/wait-for holds a program until the ports it needs accept connections.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

; Event bus (JetStream), loopback only.
[program:nats]
command=/app/code/services/nats-server --config /app/code/nats.conf
directory=/app/data
user=cloudron
autorestart=true
startsecs=2
stopwaitsecs=30
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; API; runs the database migrations on start.
[program:backend]
command=/app/code/bin/wait-for 4222 -- /app/code/services/backend
directory=/app/data
user=cloudron
environment=HOME="/app/data",ENCRYPTED_KEYS_PROVIDER="postgres"
autorestart=true
startsecs=5
stopwaitsecs=60
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Event consumer; waits for the backend's migrations itself.
[program:consumer]
command=/app/code/bin/wait-for 4222 8080 -- /app/code/services/consumer
directory=/app/data
user=cloudron
environment=HOME="/app/data",ENCRYPTED_KEYS_PROVIDER="postgres"
autorestart=true
startsecs=5
stopwaitsecs=60
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Mailbox worker (sync, sending, warmup). Holds no database: it reaches
; data keys over the backend internal API.
[program:worker]
command=/app/code/bin/wait-for 4222 8080 -- /app/code/services/worker
directory=/app/data/worker
user=cloudron
environment=HOME="/app/data/worker",ENCRYPTED_KEYS_PROVIDER="http",ENCRYPTED_KEYS_BACKEND_URL="http://127.0.0.1:8080",ENCRYPTED_KEYS_WORKER_TOKEN="%(ENV_NODE_BROKER_TOKEN)s",MAIL_TLS_INSECURE="false"
autorestart=true
startsecs=5
stopwaitsecs=60
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Open/click tracking and the website snippet.
[program:tracking]
command=/app/code/bin/wait-for 4222 8080 -- /app/code/services/tracking
directory=/app/data
user=cloudron
autorestart=true
startsecs=5
stopwaitsecs=30
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Hosted lead-capture forms.
[program:forms]
command=/app/code/bin/wait-for 8080 -- /app/code/services/forms
directory=/app/data
user=cloudron
autorestart=true
startsecs=5
stopwaitsecs=30
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Realtime gateway (Phoenix); browsers reach it through the API's socket proxy.
[program:realtime]
command=/app/code/bin/wait-for 8080 -- /app/code/realtime/bin/realtime start
directory=/run/realtime
user=cloudron
environment=HOME="/run/realtime",PORT="4000"
autorestart=true
startsecs=5
stopwaitsecs=30
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /run/warmbly/nginx.conf -g "daemon off;"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
