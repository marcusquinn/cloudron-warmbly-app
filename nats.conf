#
# Embedded event bus for the Warmbly services, loopback only. JetStream state
# lives under /app/data so it is backed up with the rest of the app.
listen: 127.0.0.1:4222
server_name: warmbly
max_payload: 8MB

jetstream {
	store_dir: "/app/data/nats"
	max_memory_store: 64MB
	max_file_store: 10GB
}
